[package]
name = "ecocash"
version = "0.1.0"
edition = "2021"
description = "Rust client for the EcoCash Open API (Zimbabwe mobile money): C2B payments, lookups, polling and refunds"
license = "MIT"
readme = "README.md"
keywords = ["ecocash", "payments", "zimbabwe", "mobile-money"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
